name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run agent workflow tests
        run: npm test
